# Publishes a release when a version tag (v1.4.2, ...) is pushed: builds the setup with
# build-release.ps1 and uploads it with SHA256SUMS.txt (what "Check for updates" downloads).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Tag must match VERSION
        shell: pwsh
        run: |
          $label = 'v' + ((Get-Content VERSION -Raw).Trim() -replace '\.0$', '')
          if ($label -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match VERSION ($label)" }

      - name: Unit tests
        run: cargo test --release --lib

      - name: Build the setup
        shell: pwsh
        run: ./build-release.ps1

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME release/*.exe release/SHA256SUMS.txt `
            --title "BatteryHub $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --latest
